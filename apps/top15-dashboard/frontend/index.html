<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOP15 市场追踪面板</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div>
          <p class="eyebrow">TOP15 ANALYST DASHBOARD</p>
          <h1>TOP15 市场追踪面板</h1>
          <p class="sub">只读本地骨架版。基于 24h 交易额 &gt; 1.5 亿美元过滤后的现货涨幅榜 TOP15。</p>
        </div>
        <div class="hero-meta">
          <div class="meta-card">
            <span>最新快照</span>
            <strong id="snapshotId">--</strong>
          </div>
          <div class="meta-card">
            <span>抓取时间</span>
            <strong id="capturedAt">--</strong>
          </div>
          <div class="meta-card">
            <span>满足条件币种</span>
            <strong id="filteredCount">--</strong>
          </div>
        </div>
      </header>

      <section class="toolbar">
        <button id="refreshBtn">刷新数据</button>
        <span id="statusText">等待加载…</span>
      </section>

      <section class="grid stats" id="leaderCards"></section>

      <section class="panel">
        <div class="panel-head">
          <h2>TOP15 当前榜单</h2>
          <p>展示宽表骨架，后续可继续接筛选、搜索、图表和多快照对比。</p>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>币种</th>
                <th>板块</th>
                <th>市值带</th>
                <th>24h涨跌</th>
                <th>24h成交额</th>
                <th>活跃度</th>
                <th>风险</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </section>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
